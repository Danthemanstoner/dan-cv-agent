<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Agent Dan inbox</title>
<style>
:root{--ink:#050a07;--line:#1a3d28;--text:#b8f0c8;--dim:#7cbc90;--mute:#4a7a5c;--g:#00ff6a;--amber:#ffbf3c;--danger:#ff6b5a;
  --mono:"SF Mono","Cascadia Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.55 var(--mono);padding:24px 16px}
main{max-width:760px;margin:0 auto}
h1{font-size:17px;color:var(--g);font-weight:normal;margin:0 0 4px}
p{color:var(--dim);margin:0 0 16px}
form{display:flex;gap:8px;margin:0 0 18px}
input{flex:1;background:none;border:1px solid var(--line);color:var(--text);padding:7px 9px;font:inherit}
input:focus{outline:none;border-color:var(--g)}
button{font:inherit;background:none;border:1px solid var(--g);color:var(--g);padding:6px 12px;cursor:pointer}
button.ghost{border-color:var(--line);color:var(--dim)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
article{border:1px solid var(--line);margin:0 0 10px}
article.new{border-color:var(--g)}
article header{display:flex;flex-wrap:wrap;gap:4px 12px;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px}
article header b{color:var(--g);font-weight:normal}
article header a{color:var(--amber)}
article .body{padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
article footer{padding:0 12px 10px}
.status{color:var(--mute)}.err{color:var(--danger)}
</style>
</head>
<body>
<main>
  <h1>Agent Dan inbox</h1>
  <p>Messages visitors asked Agent Dan to pass on. Only you can read these.</p>
  <form id="auth"><input id="token" type="password" placeholder="Inbox token" autocomplete="current-password" aria-label="Inbox token"><button>Open inbox</button></form>
  <div id="status" class="status" role="status"></div>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = '';
try { token = sessionStorage.getItem('agentdan.inbox') || ''; } catch {}
async function api(path, init = {}) {
  const r = await fetch(path, { ...init, headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) throw new Error('That token is wrong. Check it and try again.');
  if (r.status === 503) throw new Error('The inbox is not set up yet: INBOX_TOKEN is missing on the server.');
  if (!r.ok) throw new Error('The inbox did not load (' + r.status + '). Try again.');
  return r.json();
}
async function load() {
  $('status').className = 'status'; $('status').textContent = 'Loading…';
  try {
    const { messages } = await api('/api/inbox');
    $('auth').hidden = true;
    const unread = messages.filter(m => !m.read_at).length;
    $('status').textContent = messages.length ? `${messages.length} messages, ${unread} new.` : 'No messages yet.';
    $('list').innerHTML = messages.map(m => `<article class="${m.read_at ? '' : 'new'}"><header><b>${esc(m.ref)}</b><span>${esc(m.name)}</span>
      <a href="mailto:${encodeURIComponent(m.reply_to)}?subject=${encodeURIComponent('Re: your message to Agent Dan (' + m.ref + ')')}">${esc(m.reply_to)}</a>
      <span>${new Date(m.created_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}</span></header>
      <div class="body">${esc(m.message)}</div>${m.read_at ? '' : `<footer><button class="ghost" data-ref="${esc(m.ref)}">Mark as read</button></footer>`}</article>`).join('');
  } catch (e) { $('status').className = 'err'; $('status').textContent = e.message; $('auth').hidden = false; }
}
$('auth').addEventListener('submit', e => {
  e.preventDefault(); token = $('token').value.trim();
  try { sessionStorage.setItem('agentdan.inbox', token); } catch {}
  load();
});
$('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-ref]'); if (!b) return;
  b.disabled = true;
  try { await api('/api/inbox/' + encodeURIComponent(b.dataset.ref) + '/read', { method: 'POST' }); load(); }
  catch (err) { b.disabled = false; $('status').className = 'err'; $('status').textContent = err.message; }
});
if (token) load();
</script>
</body>
</html>
